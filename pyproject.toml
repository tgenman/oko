[project]
name = "oko"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.142.4",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "telethon==1.45.0",
    "python-dotenv==1.2.2",
    "python-socks[asyncio]==2.8.2",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.8.19",
    "beautifulsoup4 (==4.14.3)",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "datamodel-code-generator==0.83.0",
    "openapi-spec-validator==0.9.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["oko"]

[tool.uv]
required-version = "==0.11.28"
package = false
