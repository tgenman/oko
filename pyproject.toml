[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "oko"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.142.4",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "telethon==1.45.0",
    "python-dotenv==1.2.2",
    "python-socks[asyncio]==2.8.2",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "datamodel-code-generator==0.83.0",
    "openapi-spec-validator==0.9.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "poetry-core==2.5.0",
    "installer==0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["oko"]

[tool.poetry]
requires-poetry = "==2.5.1"
packages = [{ include = "oko" }]
include = [
    { path = "oko/frontend_build/**/*", format = ["wheel"] },
    { path = "oko/reader/legacy_generated/*.json", format = ["wheel", "sdist"] },
    { path = "oko/reader/generated/*.json", format = ["wheel", "sdist"] },
    { path = "oko/reader/generated/*.yaml", format = ["wheel", "sdist"] },
    { path = "oko/reader/docs/**/*", format = ["wheel", "sdist"] },
]
