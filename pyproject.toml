[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oko"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.4",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "telethon==1.45.0",
    "python-dotenv==1.2.2",
    "python-socks[asyncio]==2.8.2",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "datamodel-code-generator==0.83.0",
    "openapi-spec-validator==0.9.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "installer==0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["oko"]

[tool.setuptools.packages.find]
include = ["oko*"]

[tool.setuptools.package-data]
oko = ["frontend_build/**/*", "frontend_build/*.json", "reader/generated/*.json", "reader/generated/*.yaml", "reader/docs/**/*"]
