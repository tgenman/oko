name: Oko check dependencies
description: Install pinned tools and synchronize a cached project environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install pinned uv and restore its package cache
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.11.28'
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Synchronize dependencies from the checked lock
      shell: bash
      run: |
        uv sync --locked --python '${{ steps.python.outputs.python-path }}'
    - name: Install npm dependencies with diagnostic timings
      shell: bash
      run: npm ci --timing --loglevel=http --logs-dir=.scratch/npm-logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: npm-diagnostics-${{ github.job }}-${{ strategy.job-index }}
        path: .scratch/npm-logs/
        if-no-files-found: ignore
