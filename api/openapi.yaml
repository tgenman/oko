components:
  schemas:
    MaterialId:
      type: string
      minLength: 1
      examples:
      - example
    FeedId:
      type: string
      minLength: 1
      examples:
      - example
    FolderId:
      type: string
      minLength: 1
      examples:
      - example
    ProblemId:
      type: string
      minLength: 1
      examples:
      - example
    CommandId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[A-Za-z0-9_-]+$
      examples:
      - example
    ClientSessionId:
      type: string
      minLength: 1
      examples:
      - example
    RevisionId:
      type: string
      minLength: 1
      examples:
      - example
    ConfigurationRef:
      type: string
      minLength: 1
      examples:
      - example
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with a mandatory timezone offset, normalized
        to UTC in responses.
      examples:
      - '2026-10-15T10:00:00Z'
    LocalDate:
      type: string
      format: date
      examples:
      - '2026-10-14'
    IanaTimezone:
      type: string
      minLength: 1
      examples:
      - Europe/Moscow
    PositiveDecimal:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 4096
      examples:
      - '20'
    SourceUrl:
      type: string
      format: uri
      pattern: ^(?:https?://|tg://)
      maxLength: 4000
      examples:
      - https://example.test/post/1
    FeedAvatarUrl:
      examples:
      - /api/v3/feeds/example/avatar/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      type: string
      pattern: ^/api/v3/feeds/[^/]+/avatar/[a-f0-9]{64}$
      format: uri-reference
    MediaUrl:
      type: string
      pattern: ^/api/v3/materials/
      format: uri-reference
      examples:
      - /api/v3/materials/example/images/image.png
    TelegramUserId:
      type: string
      pattern: ^[1-9][0-9]*$
      examples:
      - '9007199254740993'
    TelegramPeerId:
      type: string
      pattern: ^-?[1-9][0-9]*$
      examples:
      - '-1001234567890'
    TelegramMessageId:
      type: string
      pattern: ^[1-9][0-9]*$
      examples:
      - '123'
    Importance:
      type: string
      enum:
      - normal
      - elevated
      - high
      examples:
      - normal
    ProcessorId:
      type: string
      enum:
      - codex
      - llamacpp
      examples:
      - codex
    SettingKey:
      type: string
      enum:
      - originals
      - theses
      - prompt_theses
      - prompt_filters
      - processor
      examples:
      - originals
    FeedField:
      type: string
      enum:
      - new_folder
      - folder_id
      - importance
      - initial_days
      - public_ai
      - read_history
      - auto_read
      - transport
      examples:
      - folder_id
    TelegramRole:
      type: string
      enum:
      - personal
      - collection
      examples:
      - personal
    HistoryCountSelection:
      type: object
      properties:
        mode:
          type: string
          const: count
        count:
          $ref: '#/components/schemas/PositiveDecimal'
      required:
      - mode
      - count
      additionalProperties: false
      examples:
      - mode: count
        count: '20'
    HistoryDateSelection:
      type: object
      properties:
        mode:
          type: string
          const: date
        date:
          $ref: '#/components/schemas/LocalDate'
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
      required:
      - mode
      - date
      - timezone
      additionalProperties: false
      examples:
      - mode: date
        date: '2026-10-14'
        timezone: Europe/Moscow
    HistorySelection:
      oneOf:
