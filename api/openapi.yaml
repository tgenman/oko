openapi: 3.1.0
info:
  title: Око Reader API
  version: 1.0.0
  description: Canonical API-first contract. Edit this file; builds never infer or
    overwrite it from FastAPI. Abort ends client waiting, not committed writes. A
    lost connection leaves the outcome unknown and does not justify retrying a command.
paths:
  /api/debug:
    get:
      summary: Debug entries
      operationId: debug_entries
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticJournal'
          headers:
            Cache-Control:
              schema: &id001
                type: string
              description: no-store
            X-Oko-Action:
              schema: *id001
              description: Identity of a tracked mutation (when tracked).
        '403':
          description: Invalid host, origin or bearer session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Oko-Error:
              schema: *id001
              description: Diagnostic group identity when recorded
            X-Oko-Expected:
              schema: *id001
              description: 1 for an expected business conflict; may be absent
            X-Oko-Action:
              schema: *id001
              description: Tracked command attempt identity; may be absent
        '500':
          description: Unexpected reader failure, see diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Oko-Error:
              schema: *id001
              description: Diagnostic group identity when recorded
            X-Oko-Expected:
              schema: *id001
              description: 1 for an expected business conflict; may be absent
            X-Oko-Action:
              schema: *id001
              description: Tracked command attempt identity; may be absent
      tags:
      - debug
      description: Read the current reader snapshot. Optional properties remain absent
        when not supplied.
    post:
      summary: Debug browser
      operationId: debug_browser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserError'
        required: true
      responses:
