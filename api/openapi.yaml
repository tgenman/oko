          minimum: 0
          maximum: 9007199254740991
        incomplete:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        available:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        retrying:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unavailable:
