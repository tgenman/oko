global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: oko
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: reader
    scheme: https
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/reader-metrics
    tls_config:
      server_name: oko.observer
    static_configs:
      - targets: ['reader:8765']
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'loki_source_file_.*'
        action: drop
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
